name: Neue Anzeigen sammeln

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Neue Anzeigen sammeln
        run: python scripts/collect_listings.py

      - name: Änderungen speichern
        run: |
          git config user.name "condo-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pending-listings.json
          git diff --cached --quiet || git commit -m "Neue Anzeigen zur Prüfung"
          git push
