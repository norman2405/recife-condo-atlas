name: Anzeigen sammeln

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: ATAÍDE Collector ausführen
        run: python scripts/collect_listings.py

      - name: Neue Prüfkandidaten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/pending-listings.json

          if git diff --cached --quiet; then
            echo "Keine neuen Anzeigen gefunden."
          else
            git commit -m "Neue Anzeigen zur Prüfung hinzufügen"
            git push
          fi
