name: Immobilienatlas aktualisieren

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Daten aktualisieren
        run: python scripts/update_listings.py

      - name: Änderungen speichern
        run: |
          git config user.name "condo-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Automatisches Datenupdate"
          git push
